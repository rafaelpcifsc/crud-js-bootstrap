<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controle de Tarefas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      body { font-family: "Inter", sans-serif; }
      .task-card { min-height: 300px; }
      .task-card.overdue { border-color: #dc3545; }
      .task-card.done { opacity: 0.7; }
      .task-card.done .task-title { text-decoration: line-through; }
    </style>

    <script src="index.js"></script>
  </head>
  <body class="bg-light">

    <div class="p-5 text-white text-center shadow mb-4" style="background-color: #0f766e;">
      <div class="container">
        <h1 class="display-4 font-weight-bold mb-2">
          Controle de Tarefas
        </h1>
        <p class="lead text-white-50 font-italic mb-0">Organize seus trabalhos, provas e entregas</p>
        <hr class="my-3" style="border-color: rgba(255, 255, 255, 0.2);">
        <span class="badge badge-pill badge-light px-3 py-2 font-weight-bold text-dark">CRUD: JS + Bootstrap 4</span>
      </div>
    </div>

    <div class="container">
      <div id="alert-box"></div>

      <div class="row">

        <div class="col-md-4 col-xl-3 mb-4">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white font-weight-bold">
              Nova Tarefa
            </div>
            <div class="card-body">
              <form id="task-form">

                <div class="form-group">
                  <label for="title" class="small font-weight-bold text-muted">Tarefa</label>
                  <input type="text" class="form-control" id="title" name="title" placeholder="Ex: Lista de exercícios" required>
                </div>

                <div class="form-group">
                  <label for="subject" class="small font-weight-bold text-muted">Matéria</label>
                  <input type="text" class="form-control" id="subject" name="subject" placeholder="Ex: Matemática" required>
                </div>

                <div class="form-group">
                  <label for="dueDate" class="small font-weight-bold text-muted">Data de entrega</label>
                  <input type="date" class="form-control" id="dueDate" name="dueDate" required>
                </div>

                <div class="form-group">
                  <label for="description" class="small font-weight-bold text-muted">Descrição</label>
                  <textarea class="form-control" id="description" name="description" rows="3" placeholder="O que precisa ser feito..." required></textarea>
                </div>

                <button type="submit" class="btn btn-success btn-block shadow-sm">Adicionar Tarefa</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-md-8 col-xl-9">
          <h3 class="h5 mb-3 text-secondary font-weight-bold">Minhas Tarefas</h3>

          <div class="row" id="task-list">
            <div class="col-12 text-center text-muted py-5">
              <p>Carregando tarefas...</p>
            </div>
          </div>
        </div>

      </div>
    </div>

    <footer class="bg-dark text-white-50 py-4 mt-5">
      <div class="container text-center">
        <p class="mb-1 text-white font-weight-bold">Controle de Tarefas</p>
        <small>Projeto de CRUD com JavaScript, Bootstrap 4 e json-server &middot; 2026</small>
      </div>
    </footer>

  </body>
</html>
